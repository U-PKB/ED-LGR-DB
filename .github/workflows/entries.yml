name: Process entry

# Runs when an entry is added through the "Add an entry" issue form, or when
# one is edited, labelled, closed or reopened.
on:
  issues:
    types: [opened, edited, labeled, closed, reopened]

jobs:
  process:
    if: contains(github.event.issue.body, '### UNISON region or National')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    # One run at a time per issue; different issues can run side by side.
    concurrency:
      group: entry-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Claude Code lets the analysis run on a Claude Pro or Max subscription.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyse entry and update the database
        run: node scripts/process-issue.js
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANALYSIS_EFFORT: ${{ vars.ANALYSIS_EFFORT }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save changes
        id: commit
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git add -A data/entries
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update database entry #${ISSUE_NUMBER}"
          # Other entries may have been saved at the same time, so retry on conflict.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

  deploy:
    needs: process
    if: needs.process.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
